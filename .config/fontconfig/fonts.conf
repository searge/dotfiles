<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
    <match target="font">
        <edit name="autohint" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
        <edit name="dpi" mode="assign">
            <double>102</double>
        </edit>
    </match>

    <!-- Default sans-serif font -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>-apple-system</string>
        </test>
        <!--<test qual="any" name="lang"><string>ja</string></test>-->
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>Helvetica Neue</string>
        </test>
        <!--<test qual="any" name="lang"><string>ja</string></test>-->
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>Helvetica</string>
        </test>
        <!--<test qual="any" name="lang"><string>ja</string></test>-->
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>arial</string>
        </test>
        <!--<test qual="any" name="lang"><string>ja</string></test>-->
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <!--<test qual="any" name="lang"><string>ja</string></test>-->
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Sans Var</string>
        </edit>
    </match>

    <!-- Default serif fonts -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="same">
            <string>IBM Plex Serif</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>Noto Serif</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>Noto Color Emoji</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Apple Color Emoji</string>
        </edit>
    </match>

    <!-- Default monospace fonts -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>SFMono-Regular</string>
        </test>
        <edit name="family" mode="prepend" binding="same">
            <string>0xProto Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>Hack Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>IBM Plex Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Sans Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Color Emoji</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Apple Color Emoji</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>Menlo</string>
        </test>
        <edit name="family" mode="prepend" binding="same">
            <string>0xProto Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>Hack Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>IBM Plex Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Sans Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Color Emoji</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Apple Color Emoji</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="same">
            <string>0xProto Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="prepend" binding="same">
            <string>Hack Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>IBM Plex Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Sans Mono</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Sans Mono CJK JP</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Noto Color Emoji</string>
        </edit>
        <edit name="family" mode="append" binding="same">
            <string>Apple Color Emoji</string>
        </edit>
    </match>

    <!-- Fallback fonts preference order -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>IBM Plex Sans</family>
            <family>IBM Plex Sans Var</family>
            <family>Noto Sans</family>
            <family>Roboto</family>
            <family>Noto Sans CJK JP</family>
            <family>Apple Color Emoji</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer>
            <family>IBM Plex Serif</family>
            <family>Noto Serif</family>
            <family>Noto Serif CJK JP</family>
            <family>Apple Color Emoji</family>
            <family>Noto Color Emoji</family>
            <family>Roboto Slab</family>
        </prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer>
            <family>0xProto Nerd Font Mono</family>
            <family>Hack Nerd Font Mono</family>
            <family>IBM Plex Mono</family>
            <family>Noto Sans Mono</family>
            <family>Noto Sans Mono CJK JP</family>
            <family>Roboto Mono</family>
            <family>Apple Color Emoji</family>
            <family>Noto Color Emoji</family>
        </prefer>
    </alias>
</fontconfig>
